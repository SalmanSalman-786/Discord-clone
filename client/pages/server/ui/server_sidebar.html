<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Sidebar</title>
    <link href="https://fonts.cdnfonts.com/css/gg-sans-2" rel="stylesheet" />
    <link rel="stylesheet" href="../css/server_sidebar.css" />
    <script type="module" src="../js/server_sidebar.js"></script>
</head>

<body>
    <div class="server-sidebar">
        <!-- Server name header -->
        <div class="server-header" id="serverHeader">
            <span class="server-header-name">
                <span id="serverName">Server Name</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M7 10l5 5 5-5z" />
                </svg>
            </span>
            <button class="server-header-invite" id="inviteBtn" title="Invite People">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M14 8c0-2.21-1.79-4-4-4S6 5.79 6 8s1.79 4 4 4 4-1.79 4-4zm-4 6c-3.31 0-6.16 1.79-7.6 4.44A2 2 0 0 0 4.13 21H15.87a2 2 0 0 0 1.73-2.56C16.16 15.79 13.31 14 10 14zm9-3v-3h-2v3h-3v2h3v3h2v-3h3v-2z" />
                </svg>
            </button>
        </div>

        <div class="sidebar-scroll">
            <!-- Events row -->
            <div class="events-row" id="eventsRow">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11z" />
                </svg>
                <span>Events</span>
            </div>

            <!-- Server Boosts row -->
            <div class="events-row" id="boostsRow">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2 4 6v6c0 5.06 3.42 9.79 8 11 4.58-1.21 8-5.94 8-11V6l-8-4zm0 2.24 6 3v4.76c0 4.05-2.65 7.85-6 8.94-3.35-1.09-6-4.89-6-8.94V7.24l6-3z" />
                </svg>
                <span>Server Boosts</span>
            </div>

            <div class="sidebar-divider"></div>

            <!-- Channel categories injected here by server-sidebar.js -->
            <div id="categoryList"></div>
        </div>
    </div>
</body>

</html>
