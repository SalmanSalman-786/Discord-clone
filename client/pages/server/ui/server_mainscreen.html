<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Channel</title>
    <link href="https://fonts.cdnfonts.com/css/gg-sans-2" rel="stylesheet" />
    <link rel="stylesheet" href="../css/server_mainscreen.css" />
    <script type="module" src="../js/server_mainscreen.js"></script>
</head>

<body>
    <div class="main-screen">
        <!-- Top bar -->
        <div class="channel-topbar">
            <div class="channel-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M5.88 4.12L6.4 2 4.16 1.48 3.6 3.63a2.5 2.5 0 0 0 1.82 3.03l.46 1.84a2.5 2.5 0 0 0 3.03 1.82l2.09-.53.53 2.09a2.5 2.5 0 0 0 3.03 1.82l2.09-.52.53 2.08L23 14.5l-.52-2.09 2.09-.52-.52-2.09-2.09.52-.52-2.08a2.5 2.5 0 0 0-3.03-1.83l-2.09.53-.53-2.09a2.5 2.5 0 0 0-3.03-1.82zM3 10h18v2H3v-2zm0 4h18v2H3v-2z" />
                </svg>
                <span id="channelName">channel</span>
            </div>
            <div class="topbar-icons">
                <button title="Threads">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4 4h16v2H4zM4 11h10v2H4zM4 18h16v2H4z" />
                    </svg>
                </button>
                <button title="Notifications">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" />
                    </svg>
                </button>
                <button title="Pinned Messages">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M16 3l5 5-3.5 3.5L21 15l-1.5 1.5-3.5-3.5L12.5 16.5 11 15l3.5-3.5L11 8l1.5-1.5L16 10l3.5-3.5z" />
                    </svg>
                </button>
                <button title="Members">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
                    </svg>
                </button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search" />
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z" />
                    </svg>
                </div>
            </div>
        </div>

        <div class="message-area" id="messageArea">
            <div class="channel-welcome" id="channelWelcome">
                <div class="welcome-icon"># </div>
                <h1 id="welcomeTitle">Welcome to #channel!</h1>
                <p id="welcomeSubtitle">This is the start of the #channel channel.</p>
            </div>
        </div>


        <div class="composer-bar">
            <button class="composer-icon-btn" title="Upload a File">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                </svg>
            </button>
            <input type="text" id="messageInput" placeholder="Message #channel" />
            <div class="composer-right-icons">
                <button title="Gift"><span>🎁</span></button>
                <button title="GIF"><span>GIF</span></button>
                <button title="Emoji"><span>🙂</span></button>
            </div>
        </div>
    </div>
</body>

</html>
