<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Discord </title>
    <link id="favicon" rel="icon" type="image/png"; href=""/>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/login.css" />
    <script type="module" src="../../js/auth/login.js"></script>
  </head>

  <body>
    <main class="login-page">
      <section class="login-card card">
        <div class="login-left">
          <div class="logo">
    <img src="../../assets/images/logo.png">
</div>

          <h1>Welcome Back!</h1>

          <p class="subtitle">We're so excited to see you again!</p>

          <form id="loginForm">
            <div class="form-group">
              <label for="email"> Email <span>*</span> </label>

              <input
                type="email"
                id="email"
                class="input"
                placeholder="Enter your email"
                autocomplete="email"
              />

              <small class="error" id="emailError"></small>
            </div>

            <div class="form-group">
              <label for="password"> Password <span>*</span> </label>

              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  class="input"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="password-toggle"
                  id="passwordToggle"
                >
                  👁️
                </button>
              </div>

              <small class="error" id="passwordError"></small>
            </div>

            <div class="forgot-password">
              <a href="#"> Forgot your password? </a>
            </div>

            <button type="submit" class="btn btn-primary login-btn">
              <span class="btn-text"> Log In </span>

              <span class="loader hidden"></span>
            </button>
          </form>

          <p class="register-text">
    Need an account?
    <a href="signup.html">Register</a>
</p>
          </p>
        </div>

        <!-- Right Side -->

        <div class="login-right">
          <div class="qr-box">
            <img src="../../assets/images/qr-placeholder.png" alt="QR Code" />
          </div>

          <h2>Log in with QR Code</h2>

          <p>
            Scan this with the <strong>Discord mobile app</strong> to log in
            instantly.
          </p>
        </div>
      </section>
    </main>

    <!-- Toast -->

    <div class="toast-container" id="toastContainer"></div>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-box">
        <div class="loading-spinner"></div>
        <p class="loading-text">Please wait...</p>
      </div>
    </div>


  </body>
</html>
