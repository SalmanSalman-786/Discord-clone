<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Discord | Signup</title>
    <link rel="stylesheet" href="../css/signup.css" />
    <link rel="stylesheet" href="../../../css/components.css" />
    <link id="favicon" rel="icon" type="image/png" href="" />
    <script type="module" src="../js/signup.js"></script>
</head>

<body>
    <div class="stars"></div>
    <form class="signup-card">
        <div class="field">
            <label for="email">Email <span class="required">*</span></label>
            <input type="email" id="email" required>
        </div>

        <div class="field">
            <label for="display-name">Display Name</label>
            <input type="text" id="display-name">
        </div>

        <div class="field">
            <label for="username">Username <span class="required">*</span></label>
            <input type="text" id="username" required>
        </div>

        <div class="field">
            <label for="password">Password <span class="required">*</span></label>
            <input type="password" id="password" required>
        </div>

        <div class="field">
            <label>Date of Birth <span class="required">*</span></label>
            <div class="dob-row">
                <div class="select-wrap">
                    <select id="month" required defaultValue="">
                        <option value="" disabled selected>Month</option>
                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>
                    </select>
                </div>
                <div class="select-wrap">
                    <select id="day" required>
                        <option value="" disabled selected>Day</option>
                        <script>document.write(Array.from({ length: 31 }, (_, i) => `<option>${i + 1}</option>`).join(''))</script>
                    </select>
                </div>
                <div class="select-wrap">
                    <select id="year" required>
                        <option value="" disabled selected>Year</option>
                        <script>document.write(Array.from({ length: 100 }, (_, i) => `<option>${2026 - i}</option>`).join(''))</script>
                    </select>
                </div>
            </div>
        </div>

        <div class="consent">
            <input type="checkbox" id="emails" checked>
            <p>(Optional) It's okay to send me emails with Discord updates, tips, and special offers. You can opt out at
                any time.</p>
        </div>

        <p class="terms">
            By clicking "Create Account," you agree to Discord's <a href="#">Terms of Service</a> and have read the <a
                href="#">Privacy Policy</a>.
        </p>
        <button type="submit" id="create-btn">Create Account</button>
    </form>

        <div class="toast-container" id="toastContainer"></div>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-box">
        <div class="loading-spinner"></div>
        <p class="loading-text"></p>
      </div>
    </div>
</body>

</html>
